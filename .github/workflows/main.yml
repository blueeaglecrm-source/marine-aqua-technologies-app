name: Build Marine Aqua App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Add Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              position = text.find(">")
              text = text[:position + 1] + permissions + text[position + 1:]

          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Check Flutter
        run: flutter doctor -v

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marine-aqua-technologies-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: marine-aqua-technologies-aab
          path: build/app/outputs/bundle/release/app-release.aab
